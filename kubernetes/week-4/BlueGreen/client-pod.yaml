apiVersion: v1
kind: Pod
metadata:
  name: client                              # Cluster içinden Service'lere istek atmak için istemci Pod
  namespace: ecommerce-dev
spec:
  containers:
    - name: client
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
