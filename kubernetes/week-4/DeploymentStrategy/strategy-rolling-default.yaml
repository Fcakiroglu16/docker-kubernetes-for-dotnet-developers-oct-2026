apiVersion: apps/v1                         # API sürümü
kind: Deployment                            # Nesne türü: Deployment
metadata:
  name: strategy-default
  namespace: ecommerce-dev
  labels:
    app: strategy-default
spec:
  replicas: 4                               # Stratejiler 4 Pod üzerinden karşılaştırılır
  selector:
    matchLabels:
      app: strategy-default
  strategy:
    type: RollingUpdate                     # Pod'ları kademeli değiştirir
    rollingUpdate:
      # Varsayılan değerler. 4 Pod için: maxSurge yukarı yuvarlanır (1), maxUnavailable aşağı yuvarlanır (1).
      # Hem 1 fazladan Pod açılır hem 1 Pod kullanılamaz olabilir. Dengeli ama kapasite geçici olarak düşer.
      maxSurge: 25%                          # Güncelleme sırasında istenen sayının üstüne açılabilecek en fazla Pod
      maxUnavailable: 25%                    # Güncelleme sırasında kullanılamaz olabilecek en fazla Pod
  template:
    metadata:
      labels:
        app: strategy-default
    spec:
      containers:
        - name: microservice1-api           # kubectl set image bu adı kullanır
          image: microservice1-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Startup__SeedDelaySeconds   # Açılışta 10 sn bekler, yeni Pod'un Ready olması zaman alır
              value: "10"
          resources:                        # Pod başına limit 250m: en kötü durumda (8 Pod) quota'ya sığar
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:                   # Rolling update bu probe'a göre ilerler
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
