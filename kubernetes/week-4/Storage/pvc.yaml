apiVersion: v1
kind: PersistentVolumeClaim                 # Pod'un disk talebi. Namespace'e aittir
metadata:
  name: manual-pvc
  namespace: ecommerce-dev
spec:
  accessModes:
    - ReadWriteOnce                         # PV'nin accessModes değerini karşılamalı
  storageClassName: manual                  # manual-pv ile aynı sınıf. Bu yüzden varsayılan StorageClass devreye girmez
  resources:
    requests:
      storage: 1Gi                          # İstenen boyut. LimitRange en az 1Gi şart koşar. PV de 1Gi olduğu için tam eşleşir
# Kubernetes uygun PV'yi (sınıf, accessMode, boyut) bulup PVC'ye bağlar: STATUS Pending -> Bound
