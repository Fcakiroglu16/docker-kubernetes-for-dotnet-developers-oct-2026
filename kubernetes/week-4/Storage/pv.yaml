apiVersion: v1
kind: PersistentVolume                      # Cluster seviyesinde disk kaynağı. Namespace'i yoktur
metadata:
  name: manual-pv
  labels:
    type: hostpath
spec:
  capacity:
    storage: 1Gi                            # PV'nin boyutu. PVC bundan büyük istek yapamaz
  accessModes:
    - ReadWriteOnce                         # Aynı anda tek node yazabilir
  persistentVolumeReclaimPolicy: Retain     # PVC silinince PV ve veri silinmez (Delete olsaydı disk de silinirdi)
  storageClassName: manual                  # PVC ile eşleşmek için aynı sınıf adı gerekir
  hostPath:
    path: /mnt/data/manual-pv               # Node üzerindeki klasör. Sadece eğitim/test için. Production'da kullanılmaz
    type: DirectoryOrCreate
  nodeAffinity:                             # hostPath veri tek node'da durur. Pod'u o node'a bağlamak için
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - desktop-worker            # Kendi cluster'ındaki worker adı: kubectl get nodes
