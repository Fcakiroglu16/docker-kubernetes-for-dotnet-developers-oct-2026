apiVersion: v1
kind: Pod
metadata:
  name: storage-dynamic
  namespace: ecommerce-dev
spec:
  containers:
    - name: writer
      image: busybox:1.37
      command: ["sh", "-c"]
      args:
        - |
          echo "$(date) - $HOSTNAME basladi" >> /data/log.txt
          cat /data/log.txt
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: dynamic-pvc
