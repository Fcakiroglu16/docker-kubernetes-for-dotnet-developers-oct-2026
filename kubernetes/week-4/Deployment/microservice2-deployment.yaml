apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice2-deploy
  namespace: ecommerce-dev
  labels:
    app: microservice2-deploy
spec:
  replicas: 1                               # Tek Pod: kuyruktaki mesajı tek consumer alır, log'dan takip etmek kolay olur
  selector:
    matchLabels:
      app: microservice2-deploy
  template:
    metadata:
      labels:
        app: microservice2-deploy
    spec:
      containers:
        - name: microservice2-api
          image: microservice2-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # ASPNETCORE_ENVIRONMENT verilmez: aspnet image varsayılanı Production,
          # yani appsettings.Production.json (postgres-primary ve rabbitmq-external Service adları) kullanılır.
          resources:                        # ResourceQuota ve LimitRange gereği zorunlu
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
