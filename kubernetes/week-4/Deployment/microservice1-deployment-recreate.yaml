apiVersion: apps/v1                         # API sürümü
kind: Deployment                            # Nesne türü: Deployment
metadata:
  name: microservice1-recreate              # RollingUpdate örneğinden ayrı ad ve label kullanıldı
  namespace: ecommerce-dev
  labels:
    app: microservice1-recreate
spec:
  replicas: 3
  selector:
    matchLabels:
      app: microservice1-recreate
  strategy:
    type: Recreate                          # Önce TÜM eski Pod'lar silinir, sonra yenileri açılır. Güncelleme sırasında kesinti olur
                                            # Eski ve yeni sürüm aynı anda çalışamıyorsa (örneğin veritabanı şeması uyumsuzsa) kullanılır
  template:
    metadata:
      labels:
        app: microservice1-recreate
    spec:
      containers:
        - name: microservice1-api
          image: microservice1-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Startup__SeedDelaySeconds
              value: "10"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
