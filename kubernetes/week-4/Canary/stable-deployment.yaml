apiVersion: apps/v1                         # API sürümü
kind: Deployment                            # Nesne türü: Deployment
metadata:
  name: app-stable
  namespace: ecommerce-dev
  labels:
    app: canary-api
    track: stable
spec:
  replicas: 3                              # Mevcut kararlı sürüm. Trafik payı = stable Pod sayısı / toplam Pod sayısı
  selector:
    matchLabels:
      app: canary-api
      track: stable                             # Deployment'ı diğerinden ayıran label (selector'lar çakışmasın)
  template:
    metadata:
      labels:
        app: canary-api                     # Service'in selector'ı SADECE bu label'a bakar, iki Deployment'ın Pod'ları da seçilir
        track: stable
    spec:
      containers:
        - name: microservice1-api
          image: microservice1-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Startup__SeedDelaySeconds
              value: "10"
            - name: App__Mode               # Hangi sürümün cevap verdiğini görmek için /config cevabındaki "mode" alanı
              value: "stable"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"    # Quota (limits.ephemeral-storage: 10Gi) nedeniyle açık yazıldı. LimitRange varsayılanı 1Gi ve 10 Pod ile kotayı doldurur
            limits:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:                   # Ready olmayan canary Pod trafik almaz, oran buna göre kayar
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
