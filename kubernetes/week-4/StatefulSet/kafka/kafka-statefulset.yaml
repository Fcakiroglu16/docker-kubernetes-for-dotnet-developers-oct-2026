apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: ecommerce-dev
spec:
  serviceName: kafka-headless
  replicas: 3                               # 3 broker. Her biri hem broker hem KRaft controller (ZooKeeper yok)
  podManagementPolicy: Parallel             # Pod'lar sırayla değil aynı anda başlar. Quorum kurulması için 3 broker'ın birlikte ayakta olması gerekir,
                                            # OrderedReady olsaydı kafka-0 Ready olamaz ve kafka-1 hiç başlamazdı
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      securityContext:
        fsGroup: 1000                       # Kafka imajı 1000 kullanıcısıyla çalışır, PVC'ye yazabilmesi için
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              # Pod adının sonundaki sıra numarası broker kimliği olur: kafka-0 -> node.id=0
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              # Broker kendini kalıcı DNS adıyla duyurur. Pod IP'si değişse de adres geçerli kalır
              export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${HOSTNAME}.kafka-headless.ecommerce-dev.svc.cluster.local:9092
              exec /etc/kafka/docker/run
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: CLUSTER_ID              # Tüm broker'larda aynı olmalı. Diskler bu kimlikle biçimlenir
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS   # Controller'ların kalıcı DNS adları: <id>@<host>:<port>
              value: "0@kafka-0.kafka-headless.ecommerce-dev.svc.cluster.local:9093,1@kafka-1.kafka-headless.ecommerce-dev.svc.cluster.local:9093,2@kafka-2.kafka-headless.ecommerce-dev.svc.cluster.local:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR     # Topic'ler varsayılan olarak 3 kopya tutar
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS            # Yazma için en az 2 kopya senkron olmalı
              value: "2"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_HEAP_OPTS                      # JVM heap'i container limitinin altında tut
              value: "-Xms256m -Xmx256m"
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: broker
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:                     # data-kafka-0, data-kafka-1, data-kafka-2
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
