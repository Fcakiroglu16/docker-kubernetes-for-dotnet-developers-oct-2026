apiVersion: v1
kind: Service
metadata:
  name: redis-external
  namespace: ecommerce-dev
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: redis-0   # Sadece master. Replica'lar read-only
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: 30379                             # 30000-32767 aralığı
