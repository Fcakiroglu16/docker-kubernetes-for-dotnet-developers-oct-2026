apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-external
  namespace: ecommerce-dev
spec:
  type: NodePort
  selector:
    app: rabbitmq                           # Tüm node'lar eşit, istek herhangi birine düşebilir
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      nodePort: 30672                       # 30000-32767 aralığı
    - name: management
      port: 15672
      targetPort: management
      nodePort: 31672
