apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: ecommerce-dev
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: admin
  RABBITMQ_DEFAULT_PASS: admin123           # Sadece öğrenme amaçlı. Gerçek ortamda Secret'ı repoya koyma
  RABBITMQ_ERLANG_COOKIE: "CLUSTERCOOKIE123456"   # Tüm node'larda aynı olmalı. Node'lar bu cookie ile birbirine güvenir
