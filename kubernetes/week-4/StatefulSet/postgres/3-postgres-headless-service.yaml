apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: ecommerce-dev
  labels:
    app: postgres
spec:
  clusterIP: None                           # Headless: her Pod'a postgres-N.postgres-headless... adıyla ulaşılır
  publishNotReadyAddresses: true            # Replica'lar açılışta primary'nin adını çözebilmeli
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
