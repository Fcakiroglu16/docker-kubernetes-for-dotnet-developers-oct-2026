apiVersion: v1
kind: Service
metadata:
  name: postgres-external
  namespace: ecommerce-dev
spec:
  type: NodePort
  selector:
    statefulset.kubernetes.io/pod-name: postgres-0   # Sadece primary
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432                       # 30000-32767 aralığı
