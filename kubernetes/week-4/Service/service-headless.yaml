apiVersion: v1
kind: Service
metadata:
  name: microservice1-headless
  namespace: ecommerce-dev
spec:
  clusterIP: None                           # Headless: sanal IP yok, yük dağıtımı yok. DNS doğrudan Pod IP'lerini döndürür
                                            # StatefulSet gibi her Pod'a tek tek ulaşılması gereken durumlarda kullanılır
  selector:
    app: microservice1-backend
  ports:
    - name: http
      port: 80
      targetPort: http
