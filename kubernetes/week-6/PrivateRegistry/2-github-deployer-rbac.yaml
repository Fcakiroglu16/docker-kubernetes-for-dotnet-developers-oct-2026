# GitHub Actions'ın cluster'a bağlanırken kullandığı kimlik.
# Sadece week6 namespace'inde, sadece deploy için gereken kaynaklara yetkisi vardır.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: week6
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: week6
rules:
  # Deployment oluşturma, güncelleme ve "kubectl rollout status" ile izleme
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Service oluşturma ve güncelleme
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  # Image pull secret'ını oluşturma ve güncelleme
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
  # Rollout başarısız olursa pod'ları ve olayları inceleme
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: week6
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: week6
roleRef:
  kind: Role
  name: github-deployer
  apiGroup: rbac.authorization.k8s.io
---
# ServiceAccount için süresi dolmayan bir token üretir.
# Kubernetes token'ı bu secret'ın "token" alanına kendisi yazar.
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: week6
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
