apiVersion: v1
kind: Service
metadata:
  name: week6-api
  namespace: week6
spec:
  # ClusterIP: Service sadece cluster içinden erişilebilir, ayrı bir Hetzner LB açılmaz.
  # Dış trafik Gateway (Traefik) üzerinden gelir: order.kiteloomstudio.com -> Traefik LB -> bu Service.
  # Bkz. GatewayAPI/gateway-api.md
  type: ClusterIP
  selector:
    app: week6-api
  ports:
    - port: 80 # Service'in portu, HTTPRoute backendRefs bu portu kullanır
      targetPort: 8080 # container'ın dinlediği port
