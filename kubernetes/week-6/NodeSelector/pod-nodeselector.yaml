apiVersion: v1
kind: Pod
metadata:
  name: web-ssd
  namespace: scheduling-lab
spec:
  nodeSelector:                             # Pod yalnızca disktype=ssd etiketli node'a gider
    disktype: ssd
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
