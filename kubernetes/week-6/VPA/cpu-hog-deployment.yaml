apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-hog
  namespace: scheduling-lab
spec:
  replicas: 2                               # VPA Pod'u yeniden başlatırken kesinti olmasın diye 2 replika
  selector:
    matchLabels:
      app: cpu-hog
  template:
    metadata:
      labels:
        app: cpu-hog
    spec:
      containers:
        - name: hog
          image: busybox:1.36
          command: ["sh", "-c", "while true; do :; done"]   # Sürekli CPU tüketir
          resources:
            requests:                       # Bilerek çok düşük verildi; VPA bunu yükseltecek
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
