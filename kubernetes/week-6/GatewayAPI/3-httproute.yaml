# Yönlendirme kuralı: Gateway'e gelen hangi isteğin hangi Service'e gideceği.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: week6-api
  namespace: week6
spec:
  parentRefs:
    - name: week6-gateway # bu kuralın bağlandığı Gateway
  hostnames:
    - order.kiteloomstudio.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: / # tüm path'ler
      backendRefs:
        - name: week6-api # PrivateRegistry/3-service.yaml
          port: 80 # Service'in portu
