apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: scheduling-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache                          # web Pod'ları bu etikete bakarak yanına yerleşir
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
