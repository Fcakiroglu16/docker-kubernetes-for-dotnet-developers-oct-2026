apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-spread-soft
  namespace: scheduling-lab
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-spread-soft
  template:
    metadata:
      labels:
        app: web-spread-soft
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:  # Tercih: farklı node'lara dağıl, olmazsa aynı node'a da yerleş
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: web-spread-soft
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
