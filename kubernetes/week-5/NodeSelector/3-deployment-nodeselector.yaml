apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ssd-deploy
  namespace: scheduling-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-ssd
  template:
    metadata:
      labels:
        app: web-ssd
    spec:
      nodeSelector:
        disktype: ssd                       # 3 replika da etiketli node'a toplanır
      containers:
        - name: web
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
