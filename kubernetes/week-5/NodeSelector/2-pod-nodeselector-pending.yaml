apiVersion: v1
kind: Pod
metadata:
  name: web-gpu
  namespace: scheduling-lab
spec:
  nodeSelector:                             # Hiçbir node'da bu etiket yok -> Pod Pending kalır
    accelerator: gpu
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
