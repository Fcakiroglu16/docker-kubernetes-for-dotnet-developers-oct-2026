apiVersion: v1
kind: Pod
metadata:
  name: web-required-gpu
  namespace: scheduling-lab
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:   # Hiçbir node'da accelerator=gpu yok -> Pod Pending kalır
        nodeSelectorTerms:
          - matchExpressions:
              - key: accelerator
                operator: In
                values: ["gpu"]
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
