apiVersion: v1
kind: Pod
metadata:
  name: web-preferred
  namespace: scheduling-lab
spec:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:  # Tercih: uyan node varsa orası, yoksa herhangi bir node
        - weight: 80                                    # 1-100. Uyan kuralların ağırlıkları node puanına eklenir
          preference:
            matchExpressions:
              - key: disktype
                operator: In
                values: ["ssd"]
        - weight: 20
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["desktop-worker2"]
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
