apiVersion: v1
kind: Pod
metadata:
  name: web-toleration
  namespace: scheduling-lab
spec:
  nodeSelector:                             # Toleration sadece izin verir, çekmez. Node'u nodeSelector seçtirir
    kubernetes.io/hostname: desktop-worker
  tolerations:
    - key: dedicated                        # dedicated=gpu:NoSchedule taint'ine uyar
      operator: Equal
      value: gpu
      effect: NoSchedule
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
