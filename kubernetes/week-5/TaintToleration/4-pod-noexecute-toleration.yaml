apiVersion: v1
kind: Pod
metadata:
  name: web-noexecute
  namespace: scheduling-lab
spec:
  nodeSelector:
    kubernetes.io/hostname: desktop-worker2
  tolerations:
    - key: maintenance                      # maintenance=true:NoExecute taint'i eklenince Pod 20 sn sonra çıkarılır
      operator: Equal
      value: "true"
      effect: NoExecute
      tolerationSeconds: 20                 # Toleration'ı olmayan Pod'lar anında çıkarılır
  containers:
    - name: web
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
