apiVersion: apps/v1
kind: DaemonSet                             # Her node'da (veya seçilen node'larda) tam 1 Pod çalıştırır
metadata:
  name: log-agent
  namespace: scheduling-lab
spec:
  selector:
    matchLabels:
      app: log-agent
  updateStrategy:
    type: RollingUpdate                     # Güncellemede node'lar tek tek yenilenir
    rollingUpdate:
      maxUnavailable: 1                     # Aynı anda en fazla 1 node'da Pod kapalı olabilir
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      tolerations:                          # control-plane node'u NoSchedule taint'i taşır; bununla Pod oraya da girer
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - 'while true; do echo "node=$NODE_NAME time=$(date +%T)"; sleep 10; done'
          env:
            - name: NODE_NAME               # Pod'un çalıştığı node'un adını Downward API ile al
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
