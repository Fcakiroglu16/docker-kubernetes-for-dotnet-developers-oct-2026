apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent-ssd
  namespace: scheduling-lab
spec:
  selector:
    matchLabels:
      app: log-agent-ssd
  template:
    metadata:
      labels:
        app: log-agent-ssd
    spec:
      nodeSelector:                         # Yalnızca bu etikete sahip node'larda Pod çalışır
        disktype: ssd
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo ssd-node; sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
