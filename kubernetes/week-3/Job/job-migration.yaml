apiVersion: batch/v1                 # Job, "batch" API grubundadır (Pod için v1 yazılırdı)
kind: Job                            # Bir kez çalışıp biten iş
metadata:
  name: db-migration                 # Job'un adı. Aynı namespace'te benzersiz olmalı
  namespace: ecommerce-dev           # Job'un oluşturulacağı namespace
  labels:                            # Job nesnesinin label'ları (Job'ları filtrelemek için)
    app: microservice1-api
    job-type: migration              # kubectl get jobs -l job-type=migration ile bulunur
spec:
  # Başarısız olursa en fazla kaç kez yeniden denensin (varsayılan 6).
  # Migration gibi işlerde sonsuza kadar denemek yerine düşük tutulur.
  backoffLimit: 3

  # Job bu süre (sn) içinde bitmezse zorla durdurulur ve Failed olur.
  # Takılan bir migration'ın veritabanını sonsuza kadar kilitlememesi için konur.
  activeDeadlineSeconds: 120

  # Job bittikten (başarılı ya da başarısız) bu kadar sn sonra Job ve Pod'ları otomatik silinir.
  # Yoksa biten Job'lar namespace'te birikir ve count/jobs.batch kotasını doldurur.
  ttlSecondsAfterFinished: 600

  # completions ve parallelism yazılmadığı için ikisi de 1'dir: tek Pod, tek başarılı bitiş.
  template:                          # Job'un oluşturacağı Pod'un şablonu (içi normal bir Pod spec'idir)
    metadata:
      labels:                        # Job'un Pod'larına verilen label'lar. kubectl get pods -l ... ile bulunur
        app: microservice1-api
        job-type: migration
    spec:
      # Job Pod'larında restartPolicy yalnızca Never ya da OnFailure olabilir (Always olamaz).
      # OnFailure: container hata verirse AYNI Pod içinde yeniden başlatılır.
      restartPolicy: OnFailure
      containers:
        - name: migration            # Container'ın adı (kubectl logs -c ile seçilir)
          image: busybox:1.37        # Küçük bir Linux image'ı. Gerçek projede migration aracını içeren image olur
          # Gerçek projede burada migration bundle ya da "dotnet ef database update" çalışan bir image olur.
          # Bu örnekte sh -c ile adımlar simüle edilir.
          command: ["/bin/sh", "-c"] # Container'ın başlatacağı program: shell. -c "sonraki metni script olarak çalıştır" demek
          args:                      # command'a verilen argüman: çalıştırılacak script (| ile çok satırlı yazılır)
            - |
              echo "[1/3] Migration basliyor: veritabani semasi kontrol ediliyor..."
              sleep 2
              echo "[2/3] 20261020_AddProductTable uygulaniyor..."
              sleep 2
              echo "[3/3] 20261021_AddOrderTable uygulaniyor..."
              sleep 2
              echo "Migration tamamlandi."
          resources:                # LimitRange (min 64Mi/50m) ve ResourceQuota yüzünden zorunlu
            requests:               # Scheduler bu kadarını ayırır (garanti edilen miktar)
              cpu: "100m"           # 0.1 çekirdek
              memory: "64Mi"        # LimitRange minimumu 64Mi
            limits:                 # Container bu değerleri aşamaz
              cpu: "200m"           # CPU aşılırsa yavaşlatılır (throttle)
              memory: "128Mi"       # Memory aşılırsa container OOMKilled olur
