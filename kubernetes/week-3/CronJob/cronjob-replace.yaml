apiVersion: batch/v1                 # CronJob da "batch" API grubundadır
kind: CronJob                        # Zamanlanmış olarak Job oluşturan nesne
metadata:
  name: cron-replace                      # CronJob'un adı
  namespace: ecommerce-dev           # CronJob'un oluşturulacağı namespace
  labels:                            # CronJob nesnesinin label'ları
    job-type: concurrency-replace
spec:
  # Her dakika tetiklenir ama iş 150 sn sürer: bir sonraki zaman geldiğinde önceki iş HÂLÂ çalışıyordur.
  schedule: "* * * * *"

  # Replace: önceki iş bitmediyse ONU SİL (Pod öldürülür), yerine yenisini başlat. Son veri önemliyse (ör. önbellek yenileme) kullanılır.
  concurrencyPolicy: Replace

  successfulJobsHistoryLimit: 1      # Başarılı Job geçmişinden sadece 1 tane sakla (kotayı korumak için)
  failedJobsHistoryLimit: 1          # Başarısız Job geçmişinden sadece 1 tane sakla
  jobTemplate:                       # Her tetiklenmede oluşturulacak Job'un şablonu
    spec:
      backoffLimit: 0                # Yeniden deneme yok: ilk hatada Job Failed olur
      template:                      # Job'un oluşturacağı Pod'un şablonu
        metadata:
          labels:                    # Pod'lara verilen label'lar (kubectl get pods -l job-type=concurrency-replace)
            job-type: concurrency-replace
        spec:
          restartPolicy: Never       # Hata olursa container yeniden başlatılmaz (Never ya da OnFailure olmalı)
          containers:
            - name: worker           # Container'ın adı
              image: busybox:1.37    # Küçük bir Linux image'ı
              command: ["/bin/sh", "-c"]   # Shell'i başlatır. -c "sonraki metni script olarak çalıştır" demek
              args:                  # Çalıştırılacak script. sleep 150 işi 150 sn uzatır (schedule 60 sn olduğu için sonraki tetiklenmede iş hâlâ sürer)
                - |
                  echo "Basladi: $(hostname) $(date '+%H:%M:%S')"
                  sleep 150
                  echo "Bitti: $(hostname) $(date '+%H:%M:%S')"
              resources:                # LimitRange (min 64Mi/50m) ve ResourceQuota yüzünden zorunlu
                requests:               # Scheduler bu kadarını ayırır (garanti edilen miktar)
                  cpu: "100m"           # 0.1 çekirdek
                  memory: "64Mi"        # LimitRange minimumu 64Mi
                limits:                 # Container bu değerleri aşamaz
                  cpu: "200m"           # CPU aşılırsa yavaşlatılır (throttle)
                  memory: "128Mi"       # Memory aşılırsa container OOMKilled olur
