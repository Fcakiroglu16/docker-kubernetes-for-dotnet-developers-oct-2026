apiVersion: v1
kind: Pod
metadata:
  name: weather-api
  namespace: ecommerce-dev
  labels:
    app: weather-api
spec:
  containers:
    - name: weather-api
      image: weather-api:1.0
      imagePullPolicy: IfNotPresent   # image registry'de değil, node'da yerel olarak var
      ports:
        - containerPort: 8080
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
