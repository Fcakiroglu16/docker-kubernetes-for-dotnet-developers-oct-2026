apiVersion: v1
kind: Pod
metadata:
  name: microservice1-labeled
  namespace: ecommerce-dev
  # Label'lar anahtar=değer çiftleridir. Nesneleri gruplamak ve filtrelemek için kullanılır.
  labels:
    app: microservice1-api
    tier: backend
    environment: development
    version: v1
spec:
  containers:
    - name: microservice1-api
      image: microservice1-api:1.6
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
