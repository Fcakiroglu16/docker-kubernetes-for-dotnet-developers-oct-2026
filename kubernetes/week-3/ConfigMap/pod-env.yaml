apiVersion: v1
kind: Pod
metadata:
  name: cm-env
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
spec:
  containers:
    - name: microservice1-api
      image: microservice1-api:1.6
      imagePullPolicy: IfNotPresent
      # Yol 1: ConfigMap'ten tek tek anahtar seçip ortam değişkeni yap
      env:
        - name: APP_SIZE            # container içindeki değişken adı
          valueFrom:
            configMapKeyRef:
              name: app-literal     # hangi ConfigMap
              key: APP_SIZE         # ConfigMap'teki anahtar
        - name: APP_THEME           # değişken adı anahtardan farklı olabilir
          valueFrom:
            configMapKeyRef:
              name: app-literal
              key: APP_COLOR
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
