apiVersion: v1
kind: Pod
metadata:
  name: cm-volume
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
spec:
  containers:
    - name: microservice1-api
      image: microservice1-api:1.6
      imagePullPolicy: IfNotPresent
      # Yol 3: ConfigMap'i dosya olarak container'a bağla (volume)
      volumeMounts:
        # a) subPath ile tek bir dosya olarak: ConfigMap'teki "appsettings.Production.json" anahtarı
        #    container içinde /app/appsettings.Production.json dosyası olur.
        #    Not: subPath ile bağlanan dosya ConfigMap değişince kendiliğinden güncellenmez.
        - name: app-file-volume
          mountPath: /app/appsettings.Production.json
          subPath: appsettings.Production.json
        # b) klasör olarak: ConfigMap'teki her anahtar /etc/app-config altında bir dosya olur.
        #    Bu şekilde bağlanan dosyalar ConfigMap değişince bir süre sonra kendiliğinden güncellenir.
        - name: app-yaml-volume
          mountPath: /etc/app-config
          readOnly: true
        # c) JSON'u YAML içine yazdığımız ConfigMap (app-json) klasör olarak bağlanır:
        #    /etc/app-json/appsettings.Development.json dosyası oluşur.
        - name: app-json-volume
          mountPath: /etc/app-json
          readOnly: true
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi
  volumes:
    - name: app-file-volume
      configMap:
        name: app-file
    - name: app-yaml-volume
      configMap:
        name: app-yaml
    - name: app-json-volume
      configMap:
        name: app-json
