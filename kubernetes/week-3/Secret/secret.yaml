apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Secret                                # Nesne türü: Secret (gizli veri, base64 kodlu saklanır)
metadata:
  name: db-yaml                             # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
  labels:                                   # Label'lar: nesneleri gruplamak ve filtrelemek için anahtar=değer çiftleri
    app: microservice1-api                  # Uygulamanın adı
# type belirtilmezse Opaque olur (herhangi bir anahtar=değer verisi).
type: Opaque                                # Opaque: genel amaçlı anahtar=değer verisi
# stringData: değerleri düz metin yazarsın, Kubernetes kaydederken base64'e çevirir.
# Sadece yazma için vardır; Secret'ı okuyunca stringData görünmez, data (base64) görünür.
stringData:                                 # Düz metin yaz, Kubernetes base64'e çevirip data'ya kaydeder
  DB_USER: appuser                          # Veritabanı kullanıcı adı (demo)
  DB_PASSWORD: Demo-Yaml-Passw0rd           # Veritabanı şifresi (DEMO değer)
