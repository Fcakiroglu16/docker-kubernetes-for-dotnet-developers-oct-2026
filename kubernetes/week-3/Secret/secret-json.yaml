apiVersion: v1
kind: Secret
metadata:
  name: app-secret-json
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
type: Opaque
stringData:
  # Anahtar bir dosya adı, değer ise o dosyanın içeriğidir. JSON'u "|" ile doğrudan yazabilirsin.
  # Kubernetes içeriği doğrulamaz, sadece string olarak saklar; geçerli JSON olması senin sorumluluğundadır.
  appsettings.Secrets.json: |
    {
      "ConnectionStrings": {
        "Default": "Server=db;Database=ecommerce;User Id=appuser;Password=Demo-Json-Passw0rd"
      },
      "ApiKeys": {
        "Payment": "demo-key-123"
      }
    }
