apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Secret                                # Nesne türü: Secret (gizli veri, base64 kodlu saklanır)
metadata:
  name: app-secret-json                     # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
  labels:                                   # Label'lar: nesneleri gruplamak ve filtrelemek için anahtar=değer çiftleri
    app: microservice1-api                  # Uygulamanın adı
type: Opaque                                # Opaque: genel amaçlı anahtar=değer verisi
stringData:                                 # Düz metin yaz, Kubernetes base64'e çevirip data'ya kaydeder
  # Anahtar bir dosya adı, değer ise o dosyanın içeriğidir. JSON'u "|" ile doğrudan yazabilirsin.
  # Kubernetes içeriği doğrulamaz, sadece string olarak saklar; geçerli JSON olması senin sorumluluğundadır.
  appsettings.Secrets.json: |  # Anahtar = dosya adı, değer = dosyanın içeriği (gizli JSON)
    {
      "ConnectionStrings": {
        "Default": "Server=db;Database=ecommerce;User Id=appuser;Password=Demo-Json-Passw0rd"
      },
      "ApiKeys": {
        "Payment": "demo-key-123"
      }
    }
