apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Secret                                # Nesne türü: Secret (gizli veri, base64 kodlu saklanır)
metadata:
  name: db-base64                           # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
  labels:                                   # Label'lar: nesneleri gruplamak ve filtrelemek için anahtar=değer çiftleri
    app: microservice1-api                  # Uygulamanın adı
type: Opaque                                # Opaque: genel amaçlı anahtar=değer verisi
# data: değerler base64 ile kodlanmış yazılır. Kodlamak için:  echo -n 'appuser' | base64
# -n önemlidir; olmazsa satır sonu karakteri de değere dahil olur.
# base64 şifreleme değildir, herkes geri çevirebilir: echo 'YXBwdXNlcg==' | base64 -d
data:                                       # Anahtar=değer verisi
  DB_USER: YXBwdXNlcg==                     # base64('appuser')
  DB_PASSWORD: RGVtby1CYXNlNjQtUGFzc3cwcmQ=  # base64 kodlu demo şifre
