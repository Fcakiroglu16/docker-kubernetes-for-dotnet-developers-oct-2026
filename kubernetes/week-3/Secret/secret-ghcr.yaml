apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Secret                                # Nesne türü: Secret (gizli veri, base64 kodlu saklanır)
metadata:
  name: ghcr-secret                         # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
# GitHub Container Registry (ghcr.io) için özel (private) registry kimlik bilgisi.
# Tür kubernetes.io/dockerconfigjson olmalı ve anahtar adı tam olarak ".dockerconfigjson" olmalıdır.
type: kubernetes.io/dockerconfigjson        # Özel registry kimlik bilgisi türü
stringData:                                 # Düz metin yaz, Kubernetes base64'e çevirip data'ya kaydeder
  .dockerconfigjson: |  # Docker kimlik bilgisi JSON'u (anahtar adı tam olarak böyle olmalı)
    {
      "auths": {
        "ghcr.io": {
          "username": "demo-user",
          "password": "ghp_DEMO_TOKEN_REPLACE_ME",
          "auth": "ZGVtby11c2VyOmdocF9ERU1PX1RPS0VOX1JFUExBQ0VfTUU="
        }
      }
    }
# Not: "auth" alanı "kullanıcı:token" metninin base64'üdür:  echo -n 'demo-user:TOKEN' | base64
# username ve password değerlerini GitHub kullanıcı adın ve Personal Access Token'ınla değiştir.
