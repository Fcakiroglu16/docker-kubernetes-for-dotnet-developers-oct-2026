apiVersion: v1
kind: Pod
metadata:
  name: sec-ghcr
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
spec:
  # ghcr.io'daki özel bir image'ı çekmek için ghcr-secret burada verilir.
  # <github-kullanici-adi> yerine kendi GitHub kullanıcı adını (küçük harf) yaz.
  imagePullSecrets:
    - name: ghcr-secret
  containers:
    - name: microservice1-api
      image: ghcr.io/<github-kullanici-adi>/microservice1-api:1.6
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
