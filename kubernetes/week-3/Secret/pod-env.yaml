apiVersion: v1
kind: Pod
metadata:
  name: sec-env
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
spec:
  containers:
    - name: microservice1-api
      image: microservice1-api:1.6
      imagePullPolicy: IfNotPresent
      # Yol 1: Secret'tan tek tek anahtar seçip ortam değişkeni yap
      env:
        - name: DB_USER                 # container içindeki değişken adı
          valueFrom:
            secretKeyRef:
              name: db-literal          # hangi Secret
              key: DB_USER              # Secret'taki anahtar
        - name: DATABASE_PASSWORD       # değişken adı anahtardan farklı olabilir
          valueFrom:
            secretKeyRef:
              name: db-literal
              key: DB_PASSWORD
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
