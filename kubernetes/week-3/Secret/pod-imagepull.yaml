apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Pod                                   # Nesne türü: Pod (Kubernetes'te çalışan en küçük birim)
metadata:
  name: sec-imagepull                       # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
  labels:                                   # Label'lar: nesneleri gruplamak ve filtrelemek için anahtar=değer çiftleri
    app: microservice1-api                  # Uygulamanın adı
spec:                                       # Pod'un istenen özellikleri (spec)
  # Özel (private) bir registry'den image çekmek için docker-registry türündeki Secret burada verilir.
  # Bu örnekte image yerelde olduğu için registry'ye gidilmez; amaç imagePullSecrets alanını göstermektir.
  imagePullSecrets:                         # Özel (private) registry'den image çekerken kullanılacak Secret
    - name: regcred                         # Registry kimlik bilgisini içeren Secret'ın adı
  containers:                               # Pod içinde çalışacak container'lar
    - name: microservice1-api               # Container'ın adı
      image: microservice1-api:1.6          # Çalıştırılacak image (ad:etiket)
      imagePullPolicy: IfNotPresent         # IfNotPresent: image node'da varsa registry'ye gitme
      resources:                            # CPU/memory istek ve limitleri (ResourceQuota ve LimitRange gereği zorunlu)
        requests:                           # Scheduler'ın Pod için ayıracağı garanti miktar
          cpu: "100m"                       # 100m = 0.1 çekirdek ayrılır
          memory: "128Mi"                   # 128Mi bellek ayrılır
        limits:                             # Container'ın aşamayacağı üst sınır
          cpu: "500m"                       # 500m = 0.5 çekirdek, aşılırsa yavaşlatılır (throttle)
          memory: "256Mi"                   # 256Mi, aşılırsa container OOMKilled olur
