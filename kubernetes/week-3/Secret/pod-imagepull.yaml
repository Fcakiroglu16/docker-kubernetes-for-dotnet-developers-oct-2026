apiVersion: v1
kind: Pod
metadata:
  name: sec-imagepull
  namespace: ecommerce-dev
  labels:
    app: microservice1-api
spec:
  # Özel (private) bir registry'den image çekmek için docker-registry türündeki Secret burada verilir.
  # Bu örnekte image yerelde olduğu için registry'ye gidilmez; amaç imagePullSecrets alanını göstermektir.
  imagePullSecrets:
    - name: regcred
  containers:
    - name: microservice1-api
      image: microservice1-api:1.6
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
