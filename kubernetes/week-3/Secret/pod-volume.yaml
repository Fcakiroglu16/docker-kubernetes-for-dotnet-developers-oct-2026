apiVersion: v1                              # API sürümü (v1 = çekirdek API grubu)
kind: Pod                                   # Nesne türü: Pod (Kubernetes'te çalışan en küçük birim)
metadata:
  name: sec-volume                          # Nesnenin adı (namespace içinde benzersiz olmalı)
  namespace: ecommerce-dev                  # Nesnenin oluşturulacağı namespace
  labels:                                   # Label'lar: nesneleri gruplamak ve filtrelemek için anahtar=değer çiftleri
    app: microservice1-api                  # Uygulamanın adı
spec:                                       # Pod'un istenen özellikleri (spec)
  containers:                               # Pod içinde çalışacak container'lar
    - name: microservice1-api               # Container'ın adı
      image: microservice1-api:1.6          # Çalıştırılacak image (ad:etiket)
      imagePullPolicy: IfNotPresent         # IfNotPresent: image node'da varsa registry'ye gitme
      # Yol 3: Secret'ı dosya olarak container'a bağla (volume)
      volumeMounts:                         # Volume'ları container içindeki yollara bağla
        # a) subPath ile tek bir dosya olarak: Secret'taki "appsettings.Secrets.json" anahtarı
        #    container içinde /app/appsettings.Secrets.json dosyası olur.
        #    Not: subPath ile bağlanan dosya Secret değişince kendiliğinden güncellenmez.
        - name: db-file-volume              # Bağlanacak volume'un adı (volumes listesindeki ad)
          mountPath: /app/appsettings.Secrets.json  # Container içinde bağlanacağı yol
          subPath: appsettings.Secrets.json  # Volume'dan yalnızca bu anahtarı tek dosya olarak bağla
        # b) klasör olarak: Secret'taki her anahtar /etc/app-secrets altında bir dosya olur.
        #    Bu şekilde bağlanan dosyalar Secret değişince bir süre sonra kendiliğinden güncellenir.
        - name: db-yaml-volume              # Bağlanacak volume'un adı (volumes listesindeki ad)
          mountPath: /etc/app-secrets       # Container içinde bağlanacağı yol
          readOnly: true                    # Salt okunur bağla
        # c) JSON'u YAML içine yazdığımız Secret (app-secret-json) klasör olarak bağlanır.
        - name: app-secret-json-volume      # Bağlanacak volume'un adı (volumes listesindeki ad)
          mountPath: /etc/app-secret-json   # Container içinde bağlanacağı yol
          readOnly: true                    # Salt okunur bağla
      resources:                            # CPU/memory istek ve limitleri (ResourceQuota ve LimitRange gereği zorunlu)
        requests:                           # Scheduler'ın Pod için ayıracağı garanti miktar
          cpu: "100m"                       # 100m = 0.1 çekirdek ayrılır
          memory: "128Mi"                   # 128Mi bellek ayrılır
        limits:                             # Container'ın aşamayacağı üst sınır
          cpu: "500m"                       # 500m = 0.5 çekirdek, aşılırsa yavaşlatılır (throttle)
          memory: "256Mi"                   # 256Mi, aşılırsa container OOMKilled olur
  volumes:                                  # Pod'a bağlanabilecek volume tanımları
    - name: db-file-volume                  # Volume'un adı (volumeMounts bu adla başvurur)
      secret:                               # Kaynağı bir Secret olan volume
        secretName: db-file          # ConfigMap volume'unda "name", Secret volume'unda "secretName" yazılır
    - name: db-yaml-volume                  # Volume'un adı (volumeMounts bu adla başvurur)
      secret:                               # Kaynağı bir Secret olan volume
        secretName: db-yaml                 # Kaynak Secret'ın adı
    - name: app-secret-json-volume          # Volume'un adı (volumeMounts bu adla başvurur)
      secret:                               # Kaynağı bir Secret olan volume
        secretName: app-secret-json         # Kaynak Secret'ın adı
