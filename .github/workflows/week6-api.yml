# Week6.API: main'e her merge'de image'ı build edip GHCR'ye gönderir ve k3s cluster'ına deploy eder.
# Adımların açıklaması: kubernetes/week-6/PrivateRegistry/private-registry.md
name: week6-api

on:
  push:
    branches: [main]
    paths: # sadece API veya yaml'lar değişince çalışır, md değişikliği çalıştırmaz
      - "kubernetes/week-6/PrivateRegistry/**"
      - "!kubernetes/week-6/PrivateRegistry/**/*.md"
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: read
  packages: write # GHCR'ye image göndermek için

env:
  IMAGE: ghcr.io/fcakiroglu16/week6-api # GHCR adları küçük harf olmalı
  APP_DIR: kubernetes/week-6/PrivateRegistry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # docker ve kubectl bu makinede hazır kurulu gelir
    steps:
      # Repoyu runner'a indirir. Runner boş bir makine olarak başlar.
      - uses: actions/checkout@v7

      # Her commit'e özel etiket: sha-1a2b3c4. Sonraki adımlarda $TAG olarak kullanılır.
      - name: Image etiketi
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # GITHUB_TOKEN, GitHub'ın her çalışma için otomatik ürettiği token'dır.
      - name: Docker build ve push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg APP_VERSION=$TAG -t $IMAGE:$TAG -t $IMAGE:latest $APP_DIR/Week6.API
          docker push --all-tags $IMAGE

      - name: Cluster'a bağlan
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" > ~/.kube/config
          kubectl get nodes

      # Cluster'ın private image'ı çekebilmesi için. Secret yoksa oluşturur, varsa günceller.
      - name: Image pull secret
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl apply secret docker-registry ghcr-pull-secret \
            --namespace week6 \
            --docker-server=ghcr.io \
            --docker-username=fcakiroglu16 \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      # Deployment'taki "latest" etiketini commit etiketiyle değiştirir ve uygular.
      - name: Deploy
        run: |
          sed -i "s|$IMAGE:latest|$IMAGE:$TAG|" $APP_DIR/2-deployment.yaml
          kubectl apply -f $APP_DIR/2-deployment.yaml -f $APP_DIR/3-service.yaml
          kubectl rollout status deployment/week6-api -n week6
